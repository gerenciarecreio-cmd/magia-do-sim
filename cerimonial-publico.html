<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4c5030">
  <meta name="robots" content="noindex,nofollow">
  <title>Cerimonial — A Magia do Sim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--g:#4c5030;--b:#5d4434;--c:#f5efe5;--p:#fffaf2;--l:#ded4c7;--m:#786d61}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--c);font-family:"DM Sans",sans-serif;color:#342d27}
    .wrap{max-width:1080px;margin:auto;padding:22px}.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}.mark{width:38px;height:38px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",serif}.brand strong{display:block;color:var(--b)}.brand span{font-size:9px;color:var(--m)}
    .hero{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:28px;border-radius:22px;background:var(--g);color:#fff}.hero h1{margin:5px 0;font-family:"Playfair Display",serif;font-size:36px;font-weight:500}.hero p{margin:0;color:#e6e0d7;font-size:11px}.pill{padding:7px 10px;border:1px solid rgba(255,255,255,.15);border-radius:999px;font-size:9px}
    .tabs{display:flex;gap:7px;overflow:auto;padding:14px 0}.tabs button{border:1px solid var(--l);background:var(--p);padding:9px 13px;border-radius:11px;color:var(--b);font-weight:700}.tabs button.active{background:var(--g);color:#fff;border-color:var(--g)}
    .panel{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:18px}.row{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--l)}.row:last-child{border-bottom:0}.time strong{display:block;color:var(--g);font-size:18px}.time span,.copy span,.copy small{display:block;margin-top:3px;color:var(--m);font-size:9px}.copy strong{color:var(--b)}.copy p{color:var(--m);font-size:10px;line-height:1.55}
    .check{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--l)}.check:last-child{border-bottom:0}.dot{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#e7eadc;color:var(--g);font-weight:800}.num{width:38px;height:38px;border-radius:11px;background:var(--g);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",serif}.seq{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--l)}.seq:last-child{border-bottom:0}.empty{text-align:center;padding:42px;color:var(--m)}footer{text-align:center;padding:22px 0 4px;color:#94887c;font-size:9px}
    @media(max-width:650px){.wrap{padding:14px}.hero{align-items:flex-start;flex-direction:column;padding:21px}.hero h1{font-size:29px}.panel{padding:14px}.row{grid-template-columns:62px 1fr}}
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cerimonial-publico.js?v=20260923-1"></script>
</body>
</html>
